<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Wholesale Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .register-container {
      max-width: 450px;
      margin: 50px auto;
    }
    .register-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .register-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .register-header h2 {
      color: #2c3e50;
      font-size: 28px;
      margin-bottom: 10px;
    }
    .register-header p {
      color: #7f8c8d;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #2c3e50;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
      background: #f8f9fa;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .register-links {
      text-align: center;
      margin-top: 20px;
    }
    .register-links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }
    .register-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header class="theme-header">
    <div class="theme-header-content">
      <h1>📝 Register</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="service.html">Services</a>
        <a href="payment.html">Payments</a>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <main class="theme-main">
    <div class="register-container">
      <div class="register-card">
        <div class="register-header">
          <h2>Create Account</h2>
          <p>Join us and start managing your wholesale operations</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
          </div>

          <button type="submit" class="theme-btn" style="width: 100%; margin-top: 10px;">
            Register
          </button>

          <div id="registerMessage" style="margin-top: 15px;"></div>
        </form>

        <div class="register-links">
          <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="theme-footer">
    <p>&copy; 2025 Wholesale Management Co. All rights reserved.</p>
  </footer>

  <script src="js/register.js"></script>
</body>
</html>
