<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment - Wholesale Management</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1>Payment Options</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="service.html">Services</a>
      <a href="payment.html" class="active">Payment</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Accepted Payment Methods</h2>
      <ul>
        <li>Cash</li>
        <li>M-PESA</li>
        <li>Bank Transfer</li>
        <li>PayPal</li>
        <li>Credit/Debit Cards</li>
      </ul>
    </section>

    <section>
      <h2>Make a Payment</h2>
      <form id="paymentForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="amount">Amount (KES):</label>
        <input type="number" id="amount" name="amount" required>

        <label for="method">Payment Method:</label>
        <select id="method" name="method" required>
          <option value="">-- Select Method --</option>
          <option value="cash">Cash</option>
          <option value="mpesa">M-PESA</option>
          <option value="bank">Bank Transfer</option>
          <option value="paypal">PayPal</option>
          <option value="card">Credit/Debit Card</option>
        </select>

        <label for="reference">Transaction ID / Reference No.:</label>
        <input type="text" id="reference" name="reference" required>

        <label for="status">Payment Status:</label>
        <select id="status" name="status" required>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
          <option value="failed">Failed</option>
          <option value="refunded">Refunded</option>
        </select>

        <label for="notes">Notes (Optional):</label>
        <textarea id="notes" name="notes" placeholder="Paid for Order #123></textarea>

        <button type="submit">Pay Now</button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <script src="../srcjs/payment.js"></script>

  <footer>
    <p>&copy; 2025 Wholesale Management Co. All rights reserved.</p>
  </footer>
</body>
</html>
